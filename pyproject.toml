[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-lab"
version = "1.0.0"
description = "Laboratoire pédagogique d'ingénierie des agents IA : LangChain, LangGraph, MCP, RAG et support client."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "A completer" }]
dependencies = [
    "langchain>=1.4.0",
    "langgraph>=1.2.12",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-tavily>=0.2.0",
    "langchain-experimental>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastmcp>=2.10.0",
    "chromadb>=1.0.0",
    "pypdf>=5.0.0",
    "fpdf2>=2.8.0",
    "pillow>=10.0.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.4",
    "ddgs>=9.0.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
include = [
    "shared*",
    "langchain_agents*",
    "langgraph_workflows*",
    "mcp_integration*",
    "customer_support*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: vérifications qui exigent un service externe ou un serveur déjà lancé",
]
